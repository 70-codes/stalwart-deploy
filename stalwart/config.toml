# Stalwart Mail Server configuration - FIXED.
#
# Root cause of the JMAP hang: the HTTP listener binds inside the container
# on 8080 (plaintext, because TLS is terminated at the cloudflared layer),
# but Stalwart was never told what its PUBLIC url is and was not told to
# trust the X-Forwarded-* headers coming from the tunnel.
#
# Without [server.http].url set, the JMAP /session response advertises
# api_url, download_url, upload_url and event_source_url built from
# Stalwart's idea of its own hostname - which inside a container is the
# random container id, not "mail.example.com". The session call itself
# still returns 200 (cloudflared can reach that endpoint fine), but every
# JMAP client then tries to open the *advertised* apiUrl/eventSourceUrl
# against an address that doesn't exist anywhere outside the container,
# so "nothing else hits the server" and the client just hangs.
#
# NOTE for operators on Stalwart v0.16+: the management/JMAP-registry
# rewrite moved most of this out of config.toml. The same fix is applied
# redundantly via the STALWART_PUBLIC_URL / STALWART_HOSTNAME environment
# variables in docker-compose.yml (which v0.16+ reads directly), and
# "Trust X-Forwarded headers" must additionally be enabled once via the
# WebUI/CLI (Settings -> Network -> HTTP) since v0.16 stores that as a
# managed object rather than a config.toml key. Keeping both in place is
# harmless and covers both config generations.

[server]
hostname = "mail.example.com"

# --- HTTP / JMAP / webmail listener ---------------------------------------
# Bound on plaintext HTTP because TLS is offloaded to the tunnel.
[server.listener.http]
bind = ["[::]:8080"]
protocol = "http"

# --- SMTP listeners --------------------------------------------------------
[server.listener.smtp]
bind = ["[::]:25"]
protocol = "smtp"

[server.listener.submission]
bind = ["[::]:587"]
protocol = "smtp"

# --- IMAP listeners --------------------------------------------------------
[server.listener.imap]
bind = ["[::]:143"]
protocol = "imap"

# --- HTTP base URL configuration ------------------------------------------
# THIS IS THE LOAD BEARING FIX.
#
# `url` is the single config knob that controls api_url, download_url,
# upload_url and event_source_url in the JMAP /session response (and the
# JMAP autoconfig/autodiscover URL, OAuth issuer, etc). It must be the
# externally reachable HTTPS URL that the Cloudflare Tunnel terminates -
# i.e. the same hostname configured under `ingress` in
# cloudflared/config.yml.
[server.http]
url = "https://mail.example.com"

# Trust X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host sent by
# cloudflared. Without this, Stalwart sees every request as coming from the
# cloudflared container's IP over plain HTTP, which breaks per-client rate
# limiting/brute-force protection and scheme-sensitive behaviour (cookies,
# HSTS, OAuth redirect validation).
use-x-forwarded = true

# --- JMAP long lived stream tuning ----------------------------------------
# event_source_throttle/websocket_throttle batch rapid-fire change
# notifications; websocket_heartbeat/websocket_timeout bound how long an
# idle push connection is kept open. cloudflared/config.yml's
# originRequest.keepAliveTimeout is set comfortably above
# websocket_timeout so the tunnel doesn't recycle the connection out from
# under a still-open websocket/eventsource stream.
[jmap]
event_source_throttle = "1s"
websocket_throttle = "1s"
websocket_heartbeat = "60s"
websocket_timeout = "10m"

# --- Storage --------------------------------------------------------------
[store.default]
type = "rocksdb"
path = "/var/lib/stalwart/data"

[storage]
data = "default"
fts = "default"
blob = "default"
lookup = "default"
directory = "internal"

[directory.internal]
type = "internal"
store = "default"

[authentication.fallback-admin]
user = "admin"
secret = "changeme-rotate-on-first-login"

[logger.default]
level = "info"
format = "json"
