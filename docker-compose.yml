# Stalwart Mail Server deployment behind a Cloudflare Tunnel - FIXED.
#
# This mirrors the failure the operator described: webmail and SMTP worked,
# but JMAP push silently hung after the session call because the JMAP
# /session response advertised URLs pointing at the container's internal
# hostname instead of the Cloudflare Tunnel hostname.
#
# STALWART_PUBLIC_URL / STALWART_HOSTNAME are the env vars current Stalwart
# releases (v0.16+) use to compose every advertised JMAP/OAuth/autoconfig
# URL - they are read on every boot, independent of config.toml/config.json
# content, so set them here as the primary fix. stalwart/config.toml carries
# the equivalent [server.http].url / use-x-forwarded fix for older,
# TOML-config releases. Both must point at the same hostname that
# cloudflared/config.yml's ingress rule terminates.

services:

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart
    restart: unless-stopped
    # SMTP and IMAP/POP3 are bound on the host because cloudflare tunnel does
    # not proxy non-HTTP traffic. The HTTPS / JMAP port is NOT bound on the
    # host because cloudflared will reach it via the shared mail network.
    ports:
      - "25:25"      # smtp
      - "465:465"    # smtps
      - "587:587"    # submission
      - "143:143"    # imap
      - "993:993"    # imaps
      - "110:110"    # pop3
      - "995:995"    # pop3s
    volumes:
      # config.json is what the image actually reads on startup:
      #   /usr/local/bin/stalwart --config /etc/stalwart/config.json
      # It tells Stalwart where the RocksDB data store lives. All server
      # settings (listeners, SMTP rules, JMAP config, etc.) are stored in
      # the data store, configured once via /admin on first boot.
      #
      # The original deployment mounted config.toml at /etc/stalwart/config.toml
      # — the binary never saw it and started in bootstrap/recovery mode on
      # every restart. In recovery mode url_https is hardcoded to "" and
      # STALWART_PUBLIC_URL is explicitly bypassed, so the JMAP session
      # response advertised broken URLs regardless of what was in the env.
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
    environment:
      TZ: UTC
      # Public hostname/URL the Cloudflare Tunnel terminates - must match
      # the `hostname:` entry in cloudflared/config.yml's ingress rule and
      # the [server.http].url / [server] hostname in stalwart/config.toml.
      STALWART_HOSTNAME: mail.example.com
      STALWART_PUBLIC_URL: https://mail.example.com
      # Fixed admin credential so bootstrap-listeners (below) can call the
      # JMAP management API without scraping a one-time generated password
      # out of the container logs. Rotate this after first login.
      STALWART_RECOVERY_ADMIN: admin:changeme-rotate-on-first-login
    healthcheck:
      # Overrides the image's built-in /healthz/live check, which passes even
      # in bootstrap/recovery mode (server up but STALWART_PUBLIC_URL ignored).
      #
      # This check does three things:
      #   1. Fails immediately if STALWART_PUBLIC_URL is unset or empty, so a
      #      missing env var is surfaced in the health status rather than
      #      silently matching any apiUrl (an empty grep prefix matches all).
      #   2. curl -f exits non-zero if /jmap/session returns a non-2xx status.
      #   3. grep verifies that apiUrl in the JSON response starts with
      #      STALWART_PUBLIC_URL, not an empty string or a relative path such
      #      as "/jmap/" which is what bootstrap/recovery mode produces.
      #
      # $$ in compose YAML escapes to a literal $ passed to the container
      # shell, where $$STALWART_PUBLIC_URL becomes $STALWART_PUBLIC_URL and is
      # expanded to the running container's env var value at check time.
      test:
        - "CMD-SHELL"
        - >-
          [ -n "$$STALWART_PUBLIC_URL" ] &&
          curl -fs http://127.0.0.1:8080/jmap/session
          | grep -q "\"apiUrl\":\"$$STALWART_PUBLIC_URL"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - mail

  # One-shot init: v0.16's default bootstrap only creates implicit-TLS mail
  # listeners (465/993/995) - the plaintext STARTTLS "submission" (587) and
  # "imap" (143) listeners that stalwart/config.toml used to define are gone
  # now that config.toml isn't read, even though docker-compose still maps
  # those host ports. This creates the missing NetworkListener objects via
  # the JMAP Registry API (x:NetworkListener/set) and restarts `stalwart` so
  # they bind. Idempotent: on subsequent `up`s it finds the listeners already
  # persisted in the data store and does nothing.
  #
  # Requires the docker socket to restart `stalwart` after creating the
  # listeners (new listeners only bind at process start). This grants the
  # container control over the whole Docker host - acceptable for a
  # single-host team deployment, but consider routing it through a scoped
  # proxy (e.g. tecnativa/docker-socket-proxy, RESTART-only) if that's a
  # concern in your environment.
  bootstrap-listeners:
    image: docker:cli
    container_name: bootstrap-listeners
    restart: "no"
    environment:
      STALWART_RECOVERY_ADMIN: admin:changeme-rotate-on-first-login
      STALWART_CONTAINER: stalwart
    volumes:
      - ./scripts/bootstrap_listeners.sh:/bootstrap.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "/bootstrap.sh"]
    depends_on:
      - stalwart
    networks:
      - mail

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # The tunnel credentials file is provisioned out of band via
      #   cloudflared tunnel create stalwart-mail
      # and mounted in here. Replace with your tunnel ID.
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - stalwart
    networks:
      - mail

networks:
  mail:
    driver: bridge

volumes:
  stalwart-data:
    driver: local
