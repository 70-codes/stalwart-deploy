# Cloudflare Tunnel config - FIXED.
#
# The single biggest fix for the JMAP hang lives in stalwart/config.toml
# ([server.http].url / use-x-forwarded) and the STALWART_PUBLIC_URL /
# STALWART_HOSTNAME env vars in docker-compose.yml: those make Stalwart
# advertise apiUrl/eventSourceUrl/etc. that point at this tunnel's hostname
# instead of the container's internal hostname.
#
# The originRequest block below hardens the tunnel for JMAP's long lived
# push transports (EventSource at /jmap/eventsource and WebSocket at
# /jmap/ws), which the bare ingress rule leaves at cloudflared's defaults:
#   - disableChunkedEncoding is pinned to false (the default) so the
#     text/event-stream chunked response is forwarded as a stream instead
#     of being buffered until the connection closes.
#   - keepAliveTimeout/keepAliveConnections are raised so an idle
#     EventSource/WebSocket connection (pings every ~30s, see
#     [jmap] websocket_timeout = "10m" in stalwart/config.toml) isn't
#     recycled out from under the client mid-stream.
#
# The credentials.json mounted by the compose file is provisioned by:
#   cloudflared tunnel login
#   cloudflared tunnel create stalwart-mail
#   cp ~/.cloudflared/<tunnel-id>.json ./cloudflared/credentials.json
# and the tunnel hostname is associated with the tunnel via:
#   cloudflared tunnel route dns stalwart-mail mail.example.com

tunnel: stalwart-mail
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: mail.example.com
    service: http://stalwart:8080
    originRequest:
      disableChunkedEncoding: false
      connectTimeout: 30s
      keepAliveConnections: 200
      keepAliveTimeout: 15m
  - service: http_status:404
